[project]
name = "mf-analyser"
version = "0.1.0"
description = "Indian Mutual Fund analyser — NAV history, returns, strategy backtesting, and AUM tracking"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mftool>=2.0.4",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.22.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
notebook = [
    "jupyterlab>=4.1.0",
    "ipywidgets>=8.1.0",
    "nbformat>=5.10.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
mfa = "mf_analyser.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=mf_analyser --cov-report=term-missing"
